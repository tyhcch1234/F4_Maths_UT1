.idx{width:30px;height:30px;border-radius:10px; display:grid; place-items:center; font-size:13.5px;

.actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; align-items:center}

@media print{

  .card{break-inside:avoid; box-shadow:none}
  .box[hidden]{display:block !important}

"b": "$$0.004\\beta+0.18=0.4 \\;\\Longrightarrow\\; 0.004\\beta=0.22 \\;\\Longrightarrow\\; \\beta=55$$"
}
],
"src": "https://tyhcch1234.github.io/HKDSE-Maths-Solutions/2024_P2_Q11.html"
}
]
}</script>
<script>
(function () {
  function init() {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const KEY = "f4ut1-mastered-v1";
  let mastered = {};
  try { mastered = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { mastered = {}; }

  const esc = (s) => String(s == null ? "" : s);
  const tabsEl = document.querySelector(".tabs");
  const mainEl = document.getElementById("panels");

  DATA.topics.forEach((t) => {
    const btn = document.createElement("button");
    btn.className = "tab";
    btn.setAttribute("role", "tab");
    btn.setAttribute("aria-selected", "false");
    btn.style.setProperty("--c", t.color);
    btn.dataset.topic = t.id;
    btn.innerHTML = '<span class="dot"></span><span>' + esc(t.zh) + '</span><span class="n">' +
      DATA.items.filter((i) => i.topic === t.id).length + '</span>';
    btn.addEventListener("click", () => select(t.id));
    tabsEl.appendChild(btn);

    const panel = document.createElement("section");
    panel.className = "panel";
    panel.id = "panel-" + t.id;
    panel.setAttribute("aria-label", t.zh);
    panel.style.setProperty("--c", t.color);
    panel.hidden = true;
    panel.innerHTML =
      '<div class="panel-head">' +
        '<div>' +
          '<div class="panel-title"><span class="pill"></span><div>' +
            '<h2>' + esc(t.zh) + '</h2>' +
          '</div></div>' +
          '<p class="panel-desc">' + esc(t.desc) + '</p>' +
        '</div>' +
        '<div class="tools">' +
          '<button class="tool" data-act="hints">顯示全部提示</button>' +
          '<button class="tool" data-act="sols">顯示全部解答</button>' +
          '<button class="tool" data-act="collapse">全部收起</button>' +
          '<button class="tool" data-act="reset">重設本科進度</button>' +
        '</div>' +
      '</div>' +
      '<div class="topic-progress"><span class="done-n">0 / ' + DATA.items.filter((i) => i.topic === t.id).length + '</span>' +
        '<span class="bar"><i></i></span></div>' +
      '<div class="cards"></div>';
    mainEl.appendChild(panel);

    const cards = panel.querySelector(".cards");
    const items = DATA.items.filter((i) => i.topic === t.id);
    items.forEach((it, idx) => cards.appendChild(card(it, idx, t)));
  });

  function card(it, idx, t) {
    const id = it.year + "_" + it.paper + "_" + it.qno;
    const el = document.createElement("article");
    el.className = "card";
    el.dataset.id = id;
    if (mastered[id]) el.classList.add("is-done");

    const badgeKind = it.opts.length ? "選擇題" : (it.marks ? it.marks + " 分" : "長題目");
    let html = '<div class="card-head">' +
      '<span class="idx">' + (idx + 1) + '</span>' +
      '<div class="badges">' +
        '<span class="badge src">文憑試 ' + esc(it.year) + '</span>' +
        '<span class="badge">' + esc(it.paper) + ' · ' + esc(it.qno) + '</span>' +
        '<span class="badge tag">' + badgeKind + '</span>' +
      '</div><span class="spacer"></span></div>' +
      '<p class="para"><span class="lbl">題目</span>' + esc(it.stem) + '</p>';

    if (it.opts.length) {
      html += '<div class="options">' + it.opts.map((o) =>
        '<div class="opt"><b>' + esc(o.k) + '.</b><span>' + esc(o.v) + '</span></div>').join("") + '</div>';
    }

    html += '<div class="actions">' +
      '<button class="btn hint" data-t="hint" aria-expanded="false">提示</button>' +
      '<button class="btn sol" data-t="sol" aria-expanded="false">查看解答</button>' +
      '<button class="btn done" data-t="done" aria-pressed="' + (mastered[id] ? "true" : "false") + '">' +
        (mastered[id] ? "✓ 已掌握" : "標記已掌握") + '</button>' +
      '</div>' +
      '<div class="box hintbox" hidden><span class="h">提示</span>' + esc(it.hint) + '</div>';

    let sol = '<div class="box solbox" hidden><div class="answer"><span class="lb">答案</span><span>' + esc(it.ans) + '</span></div>';
    if (it.steps && it.steps.length) {
      sol += '<ol class="steps">' + it.steps.map((s, i) =>
        '<li><span class="sn">' + (i + 1) + '</span><div class="sc">' +
        (s.t ? '<div class="st">' + esc(s.t) + '</div>' : '') +
        '<div class="sb">' + esc(s.b) + '</div></div></li>').join("") + '</ol>';
    }
    sol += '<a class="srclink" href="' + it.src + '" target="_blank" rel="noopener">開啟原始題解頁 →</a></div>';
    html += sol;
    el.innerHTML = html;

    el.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-t]");
      if (!b) return;
      const t = b.dataset.t;
      if (t === "hint" || t === "sol") {
        const box = el.querySelector(t === "hint" ? ".hintbox" : ".solbox");
        const open = box.hidden;
        box.hidden = !open;
        b.setAttribute("aria-expanded", String(open));
        if (t === "hint") b.textContent = open ? "收起提示" : "提示";
        else b.textContent = open ? "收起解答" : "查看解答";
      } else if (t === "done") {
        const on = b.getAttribute("aria-pressed") !== "true";
        b.setAttribute("aria-pressed", String(on));
        b.textContent = on ? "✓ 已掌握" : "標記已掌握";
        el.classList.toggle("is-done", on);
        if (on) mastered[el.dataset.id] = 1; else delete mastered[el.dataset.id];
        try { localStorage.setItem(KEY, JSON.stringify(mastered)); } catch (err) {}
        refresh();
      }
    });
    return el;
  }

  document.querySelectorAll(".panel").forEach((p) => {
    p.querySelector(".tools").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-act]");
      if (!b) return;
      const act = b.dataset.act;
      if (act === "reset") {
        p.querySelectorAll(".card").forEach((c) => {
          delete mastered[c.dataset.id];
          c.classList.remove("is-done");
          const d = c.querySelector('[data-t="done"]');
          if (d) { d.setAttribute("aria-pressed", "false"); d.textContent = "標記已掌握"; }
        });
        try { localStorage.setItem(KEY, JSON.stringify(mastered)); } catch (err) {}
        refresh();
        return;
      }
      p.querySelectorAll(".card").forEach((c) => {
        if (act === "collapse") {
          [".hintbox", ".solbox"].forEach((sel) => {
            const box = c.querySelector(sel); if (box) box.hidden = true;
          });
          const h = c.querySelector('[data-t="hint"]'), s = c.querySelector('[data-t="sol"]');
          if (h) { h.setAttribute("aria-expanded", "false"); h.textContent = "提示"; }
          if (s) { s.setAttribute("aria-expanded", "false"); s.textContent = "查看解答"; }
          return;
        }
        const sel = act === "hints" ? ".hintbox" : ".solbox";
        const box = c.querySelector(sel);
        if (box) box.hidden = false;
        const btn = c.querySelector(act === "hints" ? '[data-t="hint"]' : '[data-t="sol"]');
        if (btn) {
          btn.setAttribute("aria-expanded", "true");
          btn.textContent = act === "hints" ? "收起提示" : "收起解答";
        }
      });
    });
  });

  function refresh() {
    document.querySelectorAll(".panel").forEach((p) => {
      const cards = Array.from(p.querySelectorAll(".card"));
      const done = cards.filter((c) => mastered[c.dataset.id]).length;
      p.querySelector(".done-n").textContent = done + " / " + cards.length;
      p.querySelector(".bar i").style.width = (cards.length ? (done / cards.length) * 100 : 0) + "%";
    });
    const total = DATA.items.length;
    const done = DATA.items.filter((i) => mastered[i.year + "_" + i.paper + "_" + i.qno]).length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    document.getElementById("ov-num").textContent = done + " / " + total;
    document.getElementById("ov-pct").textContent = pct + "%";
    document.getElementById("ov-bar").style.width = pct + "%";
  }

  let ttries = 0;
  function typeset(el) {
    if (!window.renderMathInElement) {
      if (ttries++ < 25) setTimeout(() => typeset(el), 200);
      return;
    }
    {
      try {
        window.renderMathInElement(el, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "\\[", right: "\\]", display: true },
            { left: "$", right: "$", display: false },
            { left: "\\(", right: "\\)", display: false }
          ],
          throwOnError: false,
          ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code", "option"]
        });
      } catch (e) { /* keep raw TeX */ }
    }
  }

  function select(id) {
    document.querySelectorAll(".tab").forEach((b) =>
      b.setAttribute("aria-selected", String(b.dataset.topic === id)));
    document.querySelectorAll(".panel").forEach((p) => { p.hidden = p.id !== "panel-" + id; });
    const panel = document.getElementById("panel-" + id);
    if (panel && !panel.dataset.typeset) { typeset(panel); panel.dataset.typeset = "1"; }
    try { history.replaceState(null, "", "#" + id); } catch (e) {}
  }

  const hash = (location.hash || "").replace("#", "");
  select(DATA.topics.some((t) => t.id === hash) ? hash : DATA.topics[0].id);
  typeset(document.querySelector(".hero"));
  refresh();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
</body>
</html>
